name: CI

# The same checks `python scripts/check.py --all` runs on a developer's machine, split in two jobs that run side by side.
# Windows, because that is where Will It Run runs: paths, line endings and the Tauri shell behave differently elsewhere.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install the backend and its development tools
        run: python -m pip install -e "backend[dev]"

      - name: Lint (ruff, with the backend's settings, on the backend and on scripts/)
        working-directory: backend
        run: ruff check src tests ../scripts

      - name: Architecture contracts (import-linter)
        working-directory: backend
        run: lint-imports

      - name: Tests
        working-directory: backend
        run: python -m pytest

      - name: The Italian catalog is complete and it.ts is what it.txt says
        run: |
          python -X utf8 scripts/build_locale.py
          git diff --exit-code -- desktop/src/locales/it.ts

      - name: The generated map (docs/map/) is what the code says
        run: python -X utf8 scripts/build_context.py --check

  desktop:
    name: Desktop (TypeScript)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
