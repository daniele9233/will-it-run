name: Release installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  installer:
    name: Verify, build and attach Windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      AGENTFIT_HOME: ${{ github.workspace }}/.release-data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install build dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install -e "backend[dev]"
          npm ci --prefix desktop

      - name: Check tag and application version
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          $version = (Get-Content desktop/package.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'The tag and application version differ' }

      - name: Run the complete project checks
        run: python -X utf8 scripts/check.py --all

      - name: Build the frozen core and Windows installer
        run: .\scripts\build.ps1 -SkipTests

      - name: Prepare installer and checksum
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $assetName = "WillItRun-$version-Setup-x64.exe"
          New-Item -ItemType Directory -Force dist/release | Out-Null
          $asset = Join-Path 'dist/release' $assetName
          Copy-Item -LiteralPath 'dist/WillItRun-Setup-x64.exe' -Destination $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$asset.sha256", "$hash *$assetName`n", [Text.UTF8Encoding]::new($false))

      - name: Attach the verified installer to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "dist/release/WillItRun-$($env:RELEASE_TAG.Substring(1))-Setup-x64.exe"
          gh release upload $env:RELEASE_TAG $asset "$asset.sha256" --clobber --repo $env:GITHUB_REPOSITORY
