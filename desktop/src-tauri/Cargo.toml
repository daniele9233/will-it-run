[package]
name = "agentfit"
version = "0.1.0"
description = "Windows local AI model manager, hardware analyzer and LangGraph AI-team builder"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "agentfit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
